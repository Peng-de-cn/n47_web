name: Sync Events JSON to Firestore

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'assets/data/future.json'
      - 'assets/data/history.json'
      - 'scripts/**'
      - '.github/workflows/sync-firestore-data.yml'
  workflow_dispatch: # 支持在 GitHub Actions 页面手动点击按钮触发

jobs:
  sync_to_firestore:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install --prefix scripts

      - name: Run Update Events Script
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_N47WEB }}
        run: node scripts/update_events.js
