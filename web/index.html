<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="N47 ExtremeSport League">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <link rel="icon" type="image/png" href="favicon.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="N47 Web">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <title>N47</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: 'Rajdhani', sans-serif;
      background: black;
    }

    html {
      touch-action: manipulation;
      -webkit-text-size-adjust: 100%;
      -ms-text-size-adjust: 100%;
      -webkit-font-smoothing: antialiased;
      transform: scale(1);
      transform-origin: top left;
    }

    #splash {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: url("snow_splash.jpg") center center no-repeat;
      background-size: cover;
      z-index: 9999;
      transition: opacity 0.6s ease;
    }

    #splash-logo {
      width: 180px;
      margin-bottom: 30px;
      animation: fadeInUp 1s ease forwards;
      transform: translateZ(0);
      will-change: transform, opacity;
    }

    #loading-text {
      color: white;
      font-size: 20px;
      font-family: inherit;
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0;
      animation: fadeInUp 1s ease 0.5s forwards;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: white;
      animation: bounce 1.2s infinite ease-in-out;
    }

    .dot:nth-child(1) { animation-delay: 0s; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes fadeInUp {
      from { transform: translateY(20px); opacity: 0; }
      to   { transform: translateY(0); opacity: 1; }
    }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(1); }
      40% { transform: scale(1.5); }
    }

    .grecaptcha-badge {
      visibility: hidden;
    }
  </style>
</head>
<body>

<!-- Splash screen -->
<div id="splash">
  <img id="splash-logo" src="splash_logo.png" alt="N47 Logo" />
  <div id="loading-text">
    Loading
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>
</div>

<script>
  function hideSplash() {
    var splash = document.getElementById('splash');
    if (splash) {
      splash.style.opacity = '0';
      splash.style.pointerEvents = 'none';
      setTimeout(function() {
        if (splash && splash.parentNode) {
          splash.parentNode.removeChild(splash);
        }
      }, 600);
    }
  }

  // 1. 监听 Flutter 渲染首帧事件
  window.addEventListener('flutter-first-frame', hideSplash);

  // 2. DOM 视图挂载监听（双保险）
  if ('MutationObserver' in window) {
    var observer = new MutationObserver(function() {
      if (document.querySelector('flutter-view') || document.querySelector('flt-glass-pane') || document.querySelector('flt-scene-host')) {
        hideSplash();
        observer.disconnect();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });
  }

  // 3. 兜底保护：3 秒后强行关闭 Splash
  setTimeout(hideSplash, 3000);
</script>

<!-- 💡 直接加载编译好的纯静态 main.dart.js，彻底规避生成的 bootstrap 脚本 Bug -->
<script src="main.dart.js" type="application/javascript"></script>

</body>
</html>
