<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="N47 ExtremeSport League">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <link rel="icon" type="image/png" href="favicon.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="N47 Web">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <title>N47</title>
  <link rel="manifest" href="manifest.json">

  <link rel="preload" href="snow_splash.jpg" as="image">
  <link rel="preload" href="splash_logo.png" as="image">
  <link rel="preconnect" href="https://firestore.googleapis.com">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: 'Rajdhani', sans-serif;
      background: black;
    }

    html {
      touch-action: manipulation;
      -webkit-text-size-adjust: 100%;
      -ms-text-size-adjust: 100%;
      -webkit-font-smoothing: antialiased;
      transform: scale(1);
      transform-origin: top left;
    }

    #splash {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: url("snow_splash.jpg") center center no-repeat;
      background-size: cover;
      z-index: 9999;
      transition: opacity 0.6s ease;
    }

    #splash-logo {
      width: 180px;
      margin-bottom: 30px;
      animation: fadeInUp 1s ease forwards;
      transform: translateZ(0); /* 防止 GPU 抖动 */
      will-change: transform, opacity;
    }

    #loading-text {
      color: white;
      font-size: 20px;
      font-family: inherit;
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0;
      animation: fadeInUp 1s ease 0.5s forwards;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: white;
      animation: bounce 1.2s infinite ease-in-out;
    }

    .dot:nth-child(1) { animation-delay: 0s; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes fadeInUp {
      from { transform: translateY(20px); opacity: 0; }
      to   { transform: translateY(0); opacity: 1; }
    }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(1); }
      40% { transform: scale(1.5); }
    }

    .grecaptcha-badge {
      visibility: hidden;
    }
  </style>

  <!-- 1. 引入新版 Flutter Web bootstrap 脚本 -->
  <script src="flutter_bootstrap.js" async></script>
</head>
<body>

<!-- Splash screen -->
<div id="splash">
  <img id="splash-logo" src="splash_logo.png" alt="N47 Logo" />
  <div id="loading-text">
    Loading
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>
</div>

<script>
  // 淡出并移除 Splash
  function hideSplash() {
    const splash = document.getElementById('splash');
    if (splash) {
      splash.style.opacity = '0';
      splash.style.pointerEvents = 'none';
      splash.style.transition = 'opacity 0.6s ease';
      splash.style.transform = 'translateZ(0)';
      setTimeout(() => splash.remove(), 600);
    }
  }

  // 配置 Flutter Web 初始化钩子，在 runApp() 后隐藏 Splash
  {{flutter_js}}
  {{flutter_build_config}}

  // 监听 Flutter 渲染启动流程
  window.addEventListener('load', function () {
    if (window._flutter && window._flutter.loader) {
      _flutter.loader.load({
        onEntrypointLoaded: async function(engineInitializer) {
          try {
            const appRunner = await engineInitializer.initializeEngine();
            await appRunner.runApp();
          } catch (e) {
            console.error("Flutter 启动异常:", e);
          } finally {
            hideSplash();
          }
        }
      });
    } else {
      // 兜底：如果直接使用 flutter_bootstrap.js 启动
      setTimeout(hideSplash, 3000);
    }
  });
</script>

</body>
</html>
