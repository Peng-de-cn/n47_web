<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="N47 ExtremeSport League">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <link rel="icon" type="image/png" href="favicon.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="N47 Web">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <title>N47</title>
  <link rel="manifest" href="manifest.json">

  <!-- 预加载 Splash 静态资源 -->
  <link rel="preload" href="snow_splash.jpg" as="image">
  <link rel="preload" href="splash_logo.png" as="image">
  <link rel="preconnect" href="https://firestore.googleapis.com">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: 'Rajdhani', sans-serif;
      background: black;
    }

    html {
      touch-action: manipulation;
      -webkit-text-size-adjust: 100%;
      -ms-text-size-adjust: 100%;
      -webkit-font-smoothing: antialiased;
      transform: scale(1);
      transform-origin: top left;
    }

    #splash {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: url("snow_splash.jpg") center center no-repeat;
      background-size: cover;
      z-index: 9999;
      transition: opacity 0.6s ease;
    }

    #splash-logo {
      width: 180px;
      margin-bottom: 30px;
      animation: fadeInUp 1s ease forwards;
      transform: translateZ(0);
      will-change: transform, opacity;
    }

    #loading-text {
      color: white;
      font-size: 20px;
      font-family: inherit;
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0;
      animation: fadeInUp 1s ease 0.5s forwards;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: white;
      animation: bounce 1.2s infinite ease-in-out;
    }

    .dot:nth-child(1) { animation-delay: 0s; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes fadeInUp {
      from { transform: translateY(20px); opacity: 0; }
      to   { transform: translateY(0); opacity: 1; }
    }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(1); }
      40% { transform: scale(1.5); }
    }

    .grecaptcha-badge {
      visibility: hidden;
    }
  </style>

  <!-- 💡 核心修改 1：使用 Flutter 官方唯一的 bootstrap 占位符 -->
  {{flutter_bootstrap_js}}
</head>
<body>

<!-- Splash screen -->
<div id="splash">
  <img id="splash-logo" src="splash_logo.png" alt="N47 Logo" />
  <div id="loading-text">
    Loading
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>
</div>

<script>
  // 淡出并移除 Splash
  function hideSplash() {
    const splash = document.getElementById('splash');
    if (splash) {
      splash.style.opacity = '0';
      splash.style.pointerEvents = 'none';
      splash.style.transition = 'opacity 0.6s ease';
      splash.style.transform = 'translateZ(0)';
      setTimeout(() => splash.remove(), 600);
    }
  }

  // 💡 核心修改 2：监听 Flutter 引擎在 DOM 中创建的首帧视图（flutter-first-frame）
  // 当 Flutter 完成第一帧渲染时，立刻移除 Splash 屏，保证 100% 成功跳转
  window.addEventListener('flutter-first-frame', function () {
    hideSplash();
  });

  // 💡 核心修改 3：增加一个 5 秒的绝对安全兜底，防止因网络原因阻塞导致 Splash 死锁
  setTimeout(hideSplash, 5000);
</script>

</body>
</html>
